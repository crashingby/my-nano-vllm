[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm"
version = "0.2.0"
authors = [{ name = "Xingkai Yu" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "a lightweight vLLM implementation built from scratch"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "triton>=3.0.0",
    "transformers>=4.51.0",
    "flash-attn>=2.8.3,<2.9",
    "numpy",
    "pydantic>=2", # DeviceConfig 使用 SkipValidation。
    "safetensors",
    "tqdm",
    "typing-extensions",
    "msgspec", # EngineCoreOutput / EngineCoreOutputs 的数据结构。
    "cloudpickle", # Executor 的 callable 序列化入口。
    "pyzmq", # 多 Worker 消息队列的通知与超大消息传递。
    "setproctitle", # 设置 Worker 的操作系统进程标题，便于识别各 rank。
    "ninja", # 为按需编译 LibTorch 扩展提供构建工具。
]

[project.optional-dependencies]
benchmark = ["pyarrow"] # Alpaca 本地 Parquet 读取；LongBench JSONL 只使用标准库。
cutedsl = ["nvidia-cutlass-dsl>=4.8.1,<4.9"] # CuTe DSL kernel 的可选编译与运行依赖。

[project.urls]
Homepage="https://github.com/GeeeekExplorer/nano-vllm"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]

[tool.setuptools.package-data]
nanovllm = ["csrc/*.h", "csrc/*.cpp"]
